<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Valtrainer app icon: angular tile, red slash, crosshair. Original artwork. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#232834"/>
      <stop offset="1" stop-color="#0d0f14"/>
    </linearGradient>
    <linearGradient id="slash" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#8e2230"/>
      <stop offset="1" stop-color="#d23a48"/>
    </linearGradient>
  </defs>
  <!-- Tile with the top-right and bottom-left corners cut, like the UI panels -->
  <path d="M16 16 H412 L496 100 V496 H100 L16 412 Z" fill="url(#bg)"/>
  <path d="M16 16 H412 L496 100 V496 H100 L16 412 Z" fill="none" stroke="#ff4b57" stroke-width="10" stroke-opacity="0.9"/>
  <!-- Red slash accent -->
  <path d="M118 440 L196 440 L394 72 L316 72 Z" fill="url(#slash)" opacity="0.95"/>
  <!-- Crosshair: dark outline first, then off-white lines -->
  <g fill="#0d0f14">
    <rect x="220" y="62"  width="72" height="140"/>
    <rect x="220" y="310" width="72" height="140"/>
    <rect x="62"  y="220" width="140" height="72"/>
    <rect x="310" y="220" width="140" height="72"/>
    <rect x="216" y="216" width="80" height="80"/>
  </g>
  <g fill="#ece8e1">
    <rect x="232" y="74"  width="48" height="116"/>
    <rect x="232" y="322" width="48" height="116"/>
    <rect x="74"  y="232" width="116" height="48"/>
    <rect x="322" y="232" width="116" height="48"/>
  </g>
  <rect x="228" y="228" width="56" height="56" fill="#ff4b57"/>
</svg>
